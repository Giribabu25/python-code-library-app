services:
  db:
    image: giribabub/library:db
    deploy:
      replicas: 1
    ports:
      - "3306:3306"
    networks:
      - myapp
    volumes:
      - mydata:/var/lib/mysql

  auth_service:
    image: giribabub/library:auth
    deploy:
      replicas: 1
    ports:
      - "5001:5001"
    networks:
      - myapp
    depends_on:
      - db

  book_service:
    image: giribabub/library:book
    deploy:
      replicas: 1
    ports:
      - "5002:5002"
    networks:
      - myapp
    depends_on:
      - db

  borrow_service:
    image: giribabub/library:borrow
    deploy:
      replicas: 1
    ports:
      - "5003:5003"
    networks:
      - mydata
    depends_on:
      - db

  frontend:
    image: giribabub/library:frontend
    deploy:
      replicas: 1
    ports:
      - "5000:5000"
    networks:
      - myapp
    depends_on:
      - auth_service
      - book_service
      - borrow_service

networks:
  myapp:
    driver: overlay
volumes:
  mydata:
                       
